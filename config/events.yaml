# 이벤트 60편: 감독 15, 동료 15, 가족 8, 학교 친구 8, 여자친구 6, 공통 8
# (훈련 중 이벤트 10편: 팀 훈련 5·야간 훈련 5, 경기 전후 이벤트 6편 포함)
# trigger 의 minWeek / maxWeek 는 1~48 주차 (1주차 = 3월 1주).
# 효과 크기: 능력치 ±0.5~2, 관계도 ±2~6, 체력 ±5~20, 학업 성취 ±1~5, 컨디션 ±1
# trait: 그 선택지를 고르면 점수가 1 오르는 특성 (hardWorker 노력파, competitor 승부사, teamPlayer 팀플레이어, modelStudent 모범생)
# 학교 친구(friend) 이벤트는 오전 수업에서 '친구와 어울리기'를 고르면 15% 확률로도 나온다.
# 여자친구(girlfriend) 축은 friend_007 '친구의 소개'에서 연락처를 받으면 열린다.
# sources: 나오는 곳 (teamTraining 팀 훈련, nightTraining 야간 훈련, sunday, meet, class). 비우면 일요일·만남·수업.
# lastMatchResult [win/draw/loss], lastMatchContributed: 직전 경기 조건 (경기가 있던 주의 일요일에 우선 선택)

events:
  # ---------------- 감독 (coach) ----------------
  - id: coach_001
    axis: coach
    title: 감독과의 첫 면담
    body: 입학하고 며칠 뒤, 감독이 사무실로 불렀다. "네가 파워형 공격수라던 그 신입이지? 이 팀에서 뭘 하고 싶나?"
    trigger: { maxWeek: 4 }
    choices:
      - { text: 주전 경쟁에서 이기겠다고 말한다, effects: { coachAffinity: 4, stat: { momentum: 0.5 } }, trait: competitor }
      - { text: 팀에 필요한 역할부터 묻는다, effects: { coachAffinity: 3, stat: { teamwork: 1 } }, trait: teamPlayer }
      - { text: 긴장해서 짧게 대답하고 나온다, effects: { coachAffinity: 2, stat: { mental: 0.5 } } }
    setFlags: [met_coach]
    once: true

  - id: coach_002
    axis: coach
    title: 훈련 태도 지적
    body: 다리가 무거워 몸이 따라 주지 않던 날, 감독이 호루라기를 불어 훈련을 멈췄다. "너, 오늘 정신 어디 두고 왔어?"
    trigger: { staminaMax: 45 }
    choices:
      - { text: 변명 없이 사과하고 더 뛴다, effects: { coachAffinity: 3, stamina: -10 }, trait: hardWorker }
      - { text: 몸 상태가 안 좋다고 솔직히 말한다, effects: { coachAffinity: -2, stamina: 10 }, trait: modelStudent }
    once: false

  - id: coach_003
    axis: coach
    title: 슈팅 특훈 제안
    body: 훈련이 끝나고 감독이 공 바구니를 들고 왔다. "시간 있으면 슈팅 좀 더 차고 가라. 내가 봐 줄게."
    trigger: { requiresFlags: [met_coach], coachAffinityMin: 40 }
    choices:
      - { text: 남아서 특훈을 받는다, effects: { stat: { shotPower: 1.5, finishing: 1 }, stamina: -15, coachAffinity: 2 }, trait: hardWorker }
      - { text: 오늘은 회복이 먼저라고 정중히 사양한다, effects: { coachAffinity: -2, stamina: 5 }, trait: modelStudent }
    once: false

  - id: coach_004
    axis: coach
    title: 벤치 통보
    body: 경기 전날 명단에 네 이름이 없었다. 감독은 지나가며 "다음에 보자"라고만 했다.
    trigger: { minWeek: 8, lastMatchRole: bench, coachAffinityMax: 40 }
    choices:
      - { text: 이유를 묻는다, effects: { coachAffinity: 4, condition: -1 }, trait: competitor }
      - { text: 말없이 개인 훈련을 한다, effects: { stat: { shotPower: 1.5 }, stamina: -15 }, trait: hardWorker }
    setFlags: [benched_once]
    once: true

  - id: coach_005
    axis: coach
    title: 후반 교체 투입
    body: 이번에도 후반 교체였다. 경기 뒤 감독이 말했다. "짧게 뛰어도 보여 줄 건 보여 줘야 한다."
    trigger: { lastMatchRole: sub, minWeek: 3 }
    choices:
      - { text: 선발로 뛰고 싶다고 솔직히 말한다, effects: { coachAffinity: -2, stat: { momentum: 1 } }, trait: competitor }
      - { text: 교체로도 팀에 보탬이 되겠다고 한다, effects: { coachAffinity: 3, stat: { clutch: 1 } }, trait: teamPlayer }
    once: false

  - id: coach_006
    axis: coach
    title: 선발 명단에 오르다
    body: 화이트보드의 선발 명단 맨 위에 네 이름이 적혀 있었다. 동기들이 어깨를 툭 친다.
    trigger: { lastMatchRole: starter }
    choices:
      - { text: 들뜨지 않고 다음 경기를 준비한다, effects: { stat: { composure: 1 }, coachAffinity: 2 }, trait: hardWorker }
      - { text: 동기들에게 매점에서 한턱낸다, effects: { teammateAffinity: 4, money: -20000 } }
    once: false

  - id: coach_007
    axis: coach
    title: 재활 면담
    body: 감독이 재활 중인 너를 불렀다. "서두르면 더 길어진다. 몸부터 제대로 만들어."
    trigger: { injured: true }
    choices:
      - { text: 재활 일정을 철저히 지킨다, effects: { coachAffinity: 3, stamina: 10 }, trait: modelStudent }
      - { text: 빨리 복귀하고 싶다고 조른다, effects: { coachAffinity: -2, condition: 1 }, trait: competitor }
    once: false

  - id: coach_008
    axis: coach
    title: 방학 합숙 훈련
    body: 방학 합숙 마지막 날, 감독이 언덕 왕복 달리기를 지시했다. 다들 숨이 턱까지 찼다.
    trigger: { vacation: true }
    choices:
      - { text: 끝까지 버틴다, effects: { stat: { fitness: 1.5 }, stamina: -20, coachAffinity: 4 }, trait: hardWorker }
      - { text: 뒤처진 동기와 보조를 맞춰 함께 뛴다, effects: { stat: { workRate: 0.5 }, stamina: -10, teammateAffinity: 3 }, trait: teamPlayer }
    once: false

  # ---------------- 동료 (teammate) ----------------
  - id: teammate_001
    axis: teammate
    title: 선배의 심부름
    body: 3학년 선배가 훈련 전에 음료수 박스를 가져오라고 했다. 운동장 반대편 창고까지는 꽤 멀다.
    trigger: { maxWeek: 16 }
    choices:
      - { text: 군말 없이 다녀온다, effects: { teammateAffinity: 3, stamina: -5 }, trait: teamPlayer }
      - { text: 훈련 준비를 핑계로 동기에게 넘긴다, effects: { teammateAffinity: -3, stamina: 5 } }
    once: false

  - id: teammate_002
    axis: teammate
    title: 동기와 야간 자율훈련
    body: 동기 미드필더가 "패스 몇 개만 더 맞춰 보자"며 공을 굴려 왔다. 조명이 꺼지기까지 30분 남았다.
    choices:
      - { text: 같이 남아서 연계 훈련을 한다, effects: { stat: { passing: 1, teamwork: 1 }, stamina: -10, teammateAffinity: 3 }, trait: teamPlayer }
      - { text: 혼자 슈팅 연습을 더 한다, effects: { stat: { finishing: 1 }, stamina: -10, teammateAffinity: -2 }, trait: hardWorker }
      - { text: 오늘은 먼저 들어간다, effects: { stamina: 5, teammateAffinity: -2 } }
    once: false

  - id: teammate_003
    axis: teammate
    title: 포지션 경쟁자
    body: 같은 공격수 자리를 노리는 동기가 있다. 훈련 중에도 서로 눈치를 보는 일이 잦아졌다.
    trigger: { minWeek: 6 }
    choices:
      - { text: 선의의 경쟁을 하자고 손을 내민다, effects: { teammateAffinity: 4, stat: { mental: 1 } }, trait: teamPlayer }
      - { text: 보란 듯이 신경전을 벌인다, effects: { stat: { momentum: 1.5 }, teammateAffinity: -4 }, trait: competitor }
      - { text: 상대의 마무리 비결을 물어본다, effects: { stat: { finishing: 1 }, teammateAffinity: 2 }, trait: hardWorker }
    setFlags: [rival_met]
    once: true

  - id: teammate_004
    axis: teammate
    title: 골 세리머니 약속
    body: 다음 경기도 선발이다. 윙어 동기가 "네가 넣으면 둘이 그거 하자"며 세리머니를 연습하자고 한다.
    trigger: { lastMatchRole: starter }
    choices:
      - { text: "좋다, 같이 연습한다", effects: { teammateAffinity: 3, stat: { momentum: 0.5 } }, trait: teamPlayer }
      - { text: 골부터 넣고 생각하자며 슈팅 연습을 한다, effects: { stat: { composure: 1 }, stamina: -5 }, trait: competitor }
    once: false

  - id: teammate_005
    axis: teammate
    title: 단체 PC방 번개
    body: 훈련이 일찍 끝난 날, 부원 단톡방에 "PC방 갈 사람"이 올라왔다. 벌써 다섯 명이 손을 들었다.
    trigger: { staminaMin: 40 }
    choices:
      - { text: 같이 간다, effects: { teammateAffinity: 4, money: -10000, stamina: -5 } }
      - { text: 숙제를 핑계로 집에 간다, effects: { academics: 1, teammateAffinity: -2 }, trait: modelStudent }
      - { text: 집에서 쉰다, effects: { stamina: 10, teammateAffinity: -2 } }
    once: false

  - id: teammate_006
    axis: teammate
    title: 주장의 호출
    body: 주장이 라커룸 뒤로 너를 불렀다. "요즘 너 때문에 분위기가 좀 그렇다는 말이 있다."
    trigger: { teammateAffinityMax: 30 }
    choices:
      - { text: 팀 분위기를 해쳤다면 정중히 사과한다, effects: { teammateAffinity: 5, condition: -1 }, trait: modelStudent }
      - { text: 억울하다고 따진다, effects: { teammateAffinity: -3, stat: { mental: 1 } }, trait: competitor }
    once: false

  - id: teammate_007
    axis: teammate
    title: 동료의 부상
    body: 연습 경기에서 주전 공격수 선배가 발목을 다쳤다. 몇 주는 못 뛴다고 한다.
    trigger: { minWeek: 10 }
    choices:
      - { text: 병문안을 가서 응원한다, effects: { teammateAffinity: 5, stamina: -5 }, trait: teamPlayer }
      - { text: 그 자리를 노리고 훈련량을 늘린다, effects: { coachAffinity: 2, teammateAffinity: -4, stamina: -10 }, trait: competitor }
    once: true

  - id: teammate_008
    axis: teammate
    title: 선배의 킥 노하우
    body: 프리킥 전담 선배가 "디딤발 위치만 바꿔도 공이 달라진다"며 시범을 보여 주겠다고 한다.
    trigger: { teammateAffinityMin: 45 }
    choices:
      - { text: 해가 질 때까지 배운다, effects: { stat: { kickPower: 1.5 }, stamina: -10 }, trait: hardWorker }
      - { text: 다음에 배우겠다고 한다, effects: { teammateAffinity: -2 } }
    once: true

  # ---------------- 가족 (family) ----------------
  - id: family_001
    axis: family
    title: 엄마의 보양식
    body: 주말에 집에 오니 식탁 위에 삼계탕이 올라와 있었다. "요즘 얼굴이 반쪽이 됐네."
    choices:
      - { text: 맛있게 먹고 푹 잔다, effects: { stamina: 15, familyAffinity: 3 } }
      - { text: 몇 숟갈 뜨고 운동하러 나간다, effects: { stat: { fitness: 0.5 }, familyAffinity: -2 }, trait: hardWorker }
    once: false

  - id: family_002
    axis: family
    title: 성적표가 도착했다
    body: 집으로 성적표가 왔다. 아버지가 말없이 성적표를 식탁에 올려 두었다.
    trigger: { academicsMax: 40 }
    choices:
      - { text: 공부도 챙기겠다고 약속한다, effects: { familyAffinity: 3, academics: 3, stamina: -5 }, trait: modelStudent }
      - { text: 지금은 축구에 집중해야 한다고 설득한다, effects: { familyAffinity: -4, stat: { mental: 1 } }, trait: competitor }
    once: false

  - id: family_003
    axis: family
    title: 용돈 봉투
    body: 할머니가 "우리 손주 축구화 사라"며 봉투를 손에 쥐여 주셨다.
    trigger: { familyAffinityMin: 50 }
    choices:
      - { text: 감사히 받는다, effects: { money: 30000, familyAffinity: 2 } }
      - { text: 마음만 받고 안부 전화를 자주 드리겠다고 한다, effects: { familyAffinity: 4 }, trait: modelStudent }
    once: false

  - id: family_004
    axis: family
    title: 아버지와 프로 경기 관람
    body: 아버지가 프로 경기 표 두 장을 구해 왔다. "공격수 움직임 잘 봐 둬라."
    trigger: { minWeek: 5 }
    choices:
      - { text: 같이 가서 공격수 움직임을 메모한다, effects: { stat: { offTheBall: 1 }, familyAffinity: 4, stamina: -5 }, trait: hardWorker }
      - { text: 피곤하다며 집에서 쉰다, effects: { stamina: 10, familyAffinity: -3 } }
    once: false

  - id: family_005
    axis: family
    title: 진로 이야기
    body: 늦은 밤, 엄마가 조심스럽게 물었다. "축구, 정말 끝까지 할 거니?"
    trigger: { minWeek: 30 }
    choices:
      - { text: 끝까지 가 보겠다고 말한다, effects: { stat: { mental: 1.5 }, familyAffinity: -2 }, trait: competitor }
      - { text: 공부도 놓지 않겠다고 한다, effects: { academics: 4, familyAffinity: 4 }, trait: modelStudent }
      - { text: 아직 잘 모르겠다고 털어놓는다, effects: { condition: -1, familyAffinity: 2 } }
    once: true

  # ---------------- 학교 친구 (friend) ----------------
  - id: friend_001
    axis: friend
    title: 짝꿍의 시험 공부 제안
    body: 쪽지 시험 전날, 짝꿍이 "점심시간에 같이 문제 풀래?"라며 문제집을 펼쳤다.
    trigger: { vacation: false }
    choices:
      - { text: 같이 풀면서 모르는 걸 묻는다, effects: { academics: 3, friendAffinity: 3 }, trait: modelStudent }
      - { text: 내가 아는 문제는 짝꿍에게 설명해 준다, effects: { academics: 2, friendAffinity: 4, stamina: -5 }, trait: teamPlayer }
      - { text: 점심엔 엎드려 잔다, effects: { stamina: 10, friendAffinity: -2 } }
    once: false

  - id: friend_002
    axis: friend
    title: 반 친구의 고민
    body: 쉬는 시간, 반 친구가 "나 요즘 진짜 힘들다"며 말을 꺼냈다. 곧 훈련에 가야 할 시간이다.
    trigger: { vacation: false }
    choices:
      - { text: 훈련에 조금 늦더라도 끝까지 들어 준다, effects: { friendAffinity: 5, coachAffinity: -2 }, trait: teamPlayer }
      - { text: 내일 다시 이야기하자며 훈련에 간다, effects: { friendAffinity: -2, coachAffinity: 2 }, trait: hardWorker }
    once: false

  - id: friend_003
    axis: friend
    title: 체육대회 반 대표
    body: 체육대회 계주 반 대표가 필요하다며 반 친구들이 일제히 너를 쳐다본다.
    trigger: { minWeek: 8, maxWeek: 12 }
    choices:
      - { text: 우승하겠다며 반 대표로 뛴다, effects: { stat: { speed: 1 }, friendAffinity: 5, stamina: -10 }, trait: competitor }
      - { text: 응원단장을 맡아 반을 이끈다, effects: { friendAffinity: 4, stat: { teamwork: 0.5 } }, trait: teamPlayer }
      - { text: 부상 위험 때문에 빠진다, effects: { friendAffinity: -3, stamina: 5 } }
    once: true

  - id: friend_004
    axis: friend
    title: 친구의 노트 필기
    body: 짝꿍이 "너 어제 졸았지?"라며 정리한 노트를 내밀었다.
    trigger: { friendAffinityMin: 35, vacation: false }
    choices:
      - { text: 노트를 빌리고 매점 간식으로 보답한다, effects: { academics: 3, friendAffinity: 2, money: -10000 } }
      - { text: 고맙지만 혼자 정리해 보겠다고 한다, effects: { academics: 2, stamina: -5 }, trait: modelStudent }
    once: false

  - id: friend_005
    axis: friend
    title: 수행평가 조별 과제
    body: 조별 과제 마감이 내일이다. 반 친구들이 네 몫의 자료를 기다리고 있다.
    trigger: { vacation: false }
    choices:
      - { text: 밤을 새워 내 몫을 끝낸다, effects: { academics: 4, stamina: -15 }, trait: modelStudent }
      - { text: 운동 핑계로 미룬다, effects: { friendAffinity: -4, academics: -2 } }
      - { text: 조원들과 일을 다시 나눈다, effects: { stat: { teamwork: 0.5 }, academics: 2, friendAffinity: 2 }, trait: teamPlayer }
    once: false

  - id: friend_006
    axis: friend
    title: 축제 무대 섭외
    body: 반 친구들이 학교 축제 장기자랑에 반 대표로 나가자며 너도 끼라고 한다.
    trigger: { minWeek: 30, maxWeek: 36 }
    choices:
      - { text: 반 친구들과 무대에 선다, effects: { friendAffinity: 6, stamina: -10 }, trait: teamPlayer }
      - { text: 훈련 때문에 사양한다, effects: { coachAffinity: 2, friendAffinity: -2 }, trait: hardWorker }
    once: true

  - id: friend_007
    axis: friend
    title: 친구의 소개
    body: 친한 반 친구가 "옆 반에 너 경기 보러 왔던 애 있잖아. 연락처 줘도 되냐고 물어보더라"라며 웃는다.
    trigger: { friendAffinityMin: 40 }
    choices:
      - { text: 연락처를 받는다, effects: { friendAffinity: 2, unlockAxis: girlfriend } }
      - { text: 지금은 축구에 집중한다, effects: { stat: { mental: 0.5 } }, trait: hardWorker }
    once: true

  # ---------------- 여자친구 (girlfriend) ----------------
  - id: girlfriend_001
    axis: girlfriend
    title: 경기 응원
    body: 여자친구가 "이번 주말 경기, 친구들이랑 보러 갈게!"라고 메시지를 보냈다.
    trigger: { unlockedAxes: [girlfriend], vacation: false }
    choices:
      - { text: 꼭 골을 넣겠다고 답한다, effects: { girlfriendAffinity: 4, stat: { momentum: 1 } }, trait: competitor }
      - { text: 팀이 이기는 모습을 보여 주겠다고 답한다, effects: { girlfriendAffinity: 3, stat: { teamwork: 0.5 } }, trait: teamPlayer }
    once: false

  - id: girlfriend_002
    axis: girlfriend
    title: 하굣길
    body: 훈련이 없는 짧은 쉬는 시간, 여자친구가 교문 앞에서 기다리고 있었다. 같이 정류장까지 걷기로 했다.
    trigger: { unlockedAxes: [girlfriend], vacation: false }
    choices:
      - { text: 천천히 걸으며 이야기를 나눈다, effects: { girlfriendAffinity: 5, stamina: 5 } }
      - { text: 정류장까지 바래다주고 훈련 시간에 늦지 않게 돌아간다, effects: { girlfriendAffinity: 2, stamina: -5 }, trait: modelStudent }
    once: false

  - id: girlfriend_003
    axis: girlfriend
    title: 시험 기간
    body: 여자친구가 "시험 기간인데 도서관에서 같이 공부할래?"라고 물었다.
    trigger: { unlockedAxes: [girlfriend], vacation: false }
    choices:
      - { text: 도서관에서 같이 공부한다, effects: { academics: 4, girlfriendAffinity: 4, stamina: -5 }, trait: modelStudent }
      - { text: 훈련 때문에 이번엔 미룬다, effects: { girlfriendAffinity: -3, stat: { fitness: 0.5 } }, trait: hardWorker }
    once: false

  - id: girlfriend_004
    axis: girlfriend
    title: 방학의 하루
    body: 방학 중 훈련이 쉬는 날, 여자친구가 동네 공원에서 자전거를 타자고 했다.
    trigger: { unlockedAxes: [girlfriend], vacation: true }
    choices:
      - { text: 같이 자전거를 타고 떡볶이를 먹는다, effects: { girlfriendAffinity: 5, money: -15000, condition: 1 } }
      - { text: 합숙 준비를 해야 한다며 짧게 만난다, effects: { girlfriendAffinity: -2, stamina: 5 }, trait: hardWorker }
    once: false

  - id: girlfriend_005
    axis: girlfriend
    title: 서운한 마음
    body: 여자친구가 "요즘 축구 말고 나랑 이야기한 적 있어?"라며 서운해했다.
    trigger: { unlockedAxes: [girlfriend], girlfriendAffinityMax: 35 }
    choices:
      - { text: 진심으로 사과하고 주말에 시간을 내겠다고 한다, effects: { girlfriendAffinity: 5, stamina: -5 } }
      - { text: 지금은 축구가 먼저라고 솔직하게 말한다, effects: { girlfriendAffinity: -4, stat: { mental: 1 } }, trait: competitor }
      - { text: 시험 끝나면 같이 공부하자고 약속한다, effects: { girlfriendAffinity: 3, academics: 1 }, trait: modelStudent }
    once: false

  # ---------------- 공통 (common) ----------------
  - id: common_001
    axis: common
    title: 동네 공원 길거리 축구
    body: 공원 풋살장에서 동네 형들이 한 명이 모자란다며 손짓한다.
    choices:
      - { text: 끼어서 이기려고 뛴다, effects: { stat: { dribbling: 1 }, stamina: -10, condition: 1 }, trait: competitor }
      - { text: 벤치에서 구경만 한다, effects: { stamina: 5 } }
    once: false

  - id: common_002
    axis: common
    title: 몸살 기운
    body: 아침부터 으슬으슬 춥고 목이 칼칼하다.
    trigger: { staminaMax: 50 }
    choices:
      - { text: 약을 먹고 일찍 잔다, effects: { stamina: 15 }, trait: modelStudent }
      - { text: 참고 평소처럼 운동한다, effects: { stat: { fitness: 0.5 }, condition: -1, stamina: -10 }, trait: hardWorker }
    once: false

  - id: common_003
    axis: common
    title: 지역 신문 인터뷰
    body: 지역 신문 기자가 "요즘 눈에 띄는 1학년 공격수"라며 짧은 인터뷰를 요청했다.
    trigger: { reputationMin: 5 }
    choices:
      - { text: 팀 덕분이라며 겸손하게 답한다, effects: { reputation: 2, coachAffinity: 2 }, trait: modelStudent }
      - { text: 전국 무대를 노린다고 포부를 밝힌다, effects: { reputation: 3, stat: { momentum: 1 }, teammateAffinity: -2 }, trait: competitor }
    once: true

  # ---------------- 기존 축 보강 ----------------
  - id: coach_009
    axis: coach
    title: 감독의 개인 면담
    body: 감독이 훈련 일지를 넘기며 물었다. "1학년 끝날 때 어떤 선수가 돼 있고 싶나?"
    trigger: { coachAffinityMin: 50, minWeek: 10 }
    choices:
      - { text: 전국 대회에서 골을 넣는 선수라고 답한다, effects: { coachAffinity: 3, stat: { momentum: 1 } }, trait: competitor }
      - { text: 기본기가 탄탄한 선수라고 답한다, effects: { coachAffinity: 3, stat: { firstTouch: 1 } }, trait: modelStudent }
    once: true

  - id: coach_010
    axis: coach
    title: 훈련 일지 검사
    body: 감독이 1학년들에게 이번 주 훈련 일지를 내라고 했다.
    trigger: { minWeek: 8 }
    choices:
      - { text: 꼼꼼히 정리해서 낸다, effects: { coachAffinity: 3, academics: 1 }, trait: modelStudent }
      - { text: 동기들 일지까지 모아서 함께 낸다, effects: { coachAffinity: 2, teammateAffinity: 2 }, trait: teamPlayer }
      - { text: 훈련 내용만 짧게 적어 낸다, effects: { coachAffinity: -2, stamina: 5 } }
    once: false

  - id: teammate_009
    axis: teammate
    title: 동기의 생일
    body: 오늘이 같은 1학년 수비수의 생일이라는 걸 훈련 끝나고 알았다.
    choices:
      - { text: 동기들과 깜짝 파티를 준비한다, effects: { teammateAffinity: 4, money: -10000 }, trait: teamPlayer }
      - { text: 축하 메시지만 보낸다, effects: { teammateAffinity: 2 } }
    once: false

  - id: teammate_010
    axis: teammate
    title: 먼저 선발된 동기
    body: 같이 입학한 동기가 먼저 선발 명단에 들었다. 동기는 미안한 듯 웃는다.
    trigger: { minWeek: 12 }
    choices:
      - { text: 진심으로 축하하고 내 훈련량을 늘린다, effects: { teammateAffinity: 3, stamina: -10, stat: { workRate: 0.5 } }, trait: hardWorker }
      - { text: 감독에게 기회를 달라고 직접 말한다, effects: { coachAffinity: 2, teammateAffinity: -2 }, trait: competitor }
    once: true

  - id: family_006
    axis: family
    title: 동생의 축구 질문
    body: 초등학생 동생이 "형, 공 세게 차는 법 알려 줘!"라며 공을 들고 왔다.
    choices:
      - { text: 공원에 나가 같이 차 준다, effects: { familyAffinity: 4, stamina: -5 }, trait: teamPlayer }
      - { text: 숙제부터 끝내고 하자고 한다, effects: { familyAffinity: 2, academics: 1 }, trait: modelStudent }
    once: false

  - id: family_007
    axis: family
    title: 아버지의 조언
    body: 아버지가 "요즘 몸 관리는 어떻게 하냐"며 같이 새벽 조깅을 하자고 했다.
    trigger: { minWeek: 20 }
    choices:
      - { text: 내일 새벽부터 같이 뛴다, effects: { stat: { fitness: 1 }, familyAffinity: 3, stamina: -5 }, trait: hardWorker }
      - { text: 쉬는 것도 훈련이라며 사양한다, effects: { stamina: 10, familyAffinity: -2 }, trait: modelStudent }
    once: false

  - id: friend_008
    axis: friend
    title: 반 친구들의 응원 현수막
    body: 반 친구들이 "다음 경기에 들고 갈 거야"라며 네 이름을 쓴 현수막을 만들고 있었다.
    trigger: { minWeek: 3, maxWeek: 18, vacation: false }
    choices:
      - { text: 꼭 골 넣겠다고 약속한다, effects: { friendAffinity: 3, stat: { momentum: 0.5 } }, trait: competitor }
      - { text: 같이 남아서 현수막 만드는 걸 돕는다, effects: { friendAffinity: 4, stamina: -5 }, trait: teamPlayer }
    once: true

  - id: girlfriend_006
    axis: girlfriend
    title: 생일 선물 고민
    body: 다음 주가 여자친구 생일이다. 용돈은 넉넉하지 않다.
    trigger: { unlockedAxes: [girlfriend] }
    choices:
      - { text: 훈련 없는 날 짬을 내 선물을 사러 간다, effects: { girlfriendAffinity: 5, money: -20000, stamina: -5 }, trait: hardWorker }
      - { text: 정성껏 손편지를 쓴다, effects: { girlfriendAffinity: 4 }, trait: modelStudent }
    once: false

  # ---------------- 팀 훈련 중 (오후 팀 훈련을 마칠 때 5%) ----------------
  - id: coach_011
    axis: coach
    title: 침투 타이밍 지적
    body: 전술 훈련 중 감독이 호루라기를 불었다. "너, 침투가 반 박자 늦어. 다시."
    trigger: { sources: [teamTraining] }
    choices:
      - { text: 될 때까지 혼자 반복한다, effects: { stat: { offTheBall: 1 }, stamina: -10 }, trait: hardWorker }
      - { text: 패스하는 동료와 타이밍을 맞춰 본다, effects: { stat: { teamwork: 1 }, teammateAffinity: 2 }, trait: teamPlayer }
    once: false

  - id: coach_012
    axis: coach
    title: 미니게임 조장
    body: 훈련 마무리 미니게임에서 감독이 너에게 한 팀 조장을 맡겼다.
    trigger: { sources: [teamTraining] }
    choices:
      - { text: 무조건 이기는 쪽으로 팀을 짠다, effects: { stat: { momentum: 1 }, coachAffinity: 2 }, trait: competitor }
      - { text: 모두 고르게 뛰도록 자리를 나눈다, effects: { teammateAffinity: 3, coachAffinity: 2 }, trait: teamPlayer }
    once: false

  - id: coach_013
    axis: coach
    title: 슈팅 시범
    body: 감독이 "파워형이면 한번 보여 줘 봐"라며 1학년들 앞에서 슈팅 시범을 시켰다.
    trigger: { sources: [teamTraining] }
    choices:
      - { text: 있는 힘껏 강슛을 날린다, effects: { stat: { shotPower: 1 }, coachAffinity: 2 }, trait: competitor }
      - { text: 배운 자세대로 정확하게 찬다, effects: { stat: { finishing: 1 }, coachAffinity: 2 }, trait: modelStudent }
    once: false

  - id: teammate_011
    axis: teammate
    title: 패스 실수 다툼
    body: 패스 훈련 중 동기의 패스가 계속 뒤로 온다. 결국 서로 언성이 높아졌다.
    trigger: { sources: [teamTraining] }
    choices:
      - { text: 먼저 사과하고 다시 맞춰 본다, effects: { teammateAffinity: 3, stat: { passing: 0.5 } }, trait: modelStudent }
      - { text: 다음엔 정확히 달라고 분명히 말한다, effects: { teammateAffinity: -2, stat: { momentum: 1 } }, trait: competitor }
    once: false

  - id: teammate_012
    axis: teammate
    title: 선배의 몸싸움 요령
    body: 몸싸움 훈련에서 3학년 수비수가 "어깨를 이렇게 넣어야 안 밀린다"며 붙어 주겠다고 한다.
    trigger: { sources: [teamTraining] }
    choices:
      - { text: 밀리지 않겠다며 넘어져도 끝까지 부딪친다, effects: { stat: { heading: 1 }, stamina: -10 }, trait: competitor }
      - { text: 동기들도 불러 같이 배운다, effects: { teammateAffinity: 3, stat: { teamwork: 0.5 } }, trait: teamPlayer }
    once: false

  # ---------------- 야간 개인 훈련 중 (마칠 때 5%) ----------------
  - id: teammate_013
    axis: teammate
    title: 야간 슈팅 내기
    body: 야간 훈련에 남은 동기가 "열 개 중 몇 개 넣나 내기하자"고 한다.
    trigger: { sources: [nightTraining] }
    choices:
      - { text: 이길 때까지 계속 찬다, effects: { stat: { finishing: 1 }, stamina: -10 }, trait: competitor }
      - { text: 서로 자세를 봐 주며 찬다, effects: { stat: { composure: 1 }, teammateAffinity: 2 }, trait: teamPlayer }
    once: false

  - id: teammate_014
    axis: teammate
    title: 같은 1학년의 부탁
    body: 다른 반 1학년 부원이 "헤딩 좀 가르쳐 줄 수 있어?"라며 다가왔다.
    trigger: { sources: [nightTraining] }
    choices:
      - { text: 시간을 내서 가르쳐 준다, effects: { teammateAffinity: 3, stat: { teamwork: 0.5 } }, trait: teamPlayer }
      - { text: 내 훈련을 다 마친 뒤에 봐 주겠다고 한다, effects: { stat: { heading: 0.5 }, teammateAffinity: -2 }, trait: hardWorker }
    once: false

  - id: common_004
    axis: common
    title: 텅 빈 운동장
    body: 다들 돌아가고 운동장에 혼자 남았다. 공 바구니가 아직 가득하다.
    trigger: { sources: [nightTraining] }
    choices:
      - { text: 바구니가 빌 때까지 슈팅한다, effects: { stat: { shotPower: 1 }, stamina: -15 }, trait: hardWorker }
      - { text: 오늘 훈련 내용을 일지에 정리한다, effects: { stat: { composure: 0.5 }, academics: 1 }, trait: modelStudent }
    once: false

  - id: common_005
    axis: common
    title: 조명이 꺼진 뒤
    body: 경비 아저씨가 운동장 조명을 끄며 "학생, 이제 들어가야지"라고 했다.
    trigger: { sources: [nightTraining] }
    choices:
      - { text: 어두운 트랙을 몇 바퀴 더 뛴다, effects: { stat: { fitness: 1 }, stamina: -10 }, trait: hardWorker }
      - { text: 인사하고 바로 귀가한다, effects: { stamina: 5 }, trait: modelStudent }
    once: false

  - id: common_006
    axis: common
    title: 뭉친 다리
    body: 개인 훈련을 마치자 종아리가 돌처럼 뭉쳤다.
    trigger: { sources: [nightTraining] }
    choices:
      - { text: 폼롤러로 꼼꼼히 풀고 일찍 잔다, effects: { stamina: 10 }, trait: modelStudent }
      - { text: 기록을 깨겠다며 마지막 세트까지 한다, effects: { stat: { kickPower: 0.5 }, condition: -1 }, trait: competitor }
    once: false

  # ---------------- 경기 전후 (경기가 있던 주의 일요일에 우선) ----------------
  - id: match_001
    axis: coach
    title: 승리 후 미팅
    body: 이긴 경기 뒤 라커룸, 감독이 "오늘 잘했다. 그런데 여기서 만족할 거냐?"라고 물었다.
    trigger: { lastMatchResult: [win], maxWeek: 18 }
    choices:
      - { text: 다음 경기는 더 크게 이기겠다고 한다, effects: { coachAffinity: 3, stat: { momentum: 1 } }, trait: competitor }
      - { text: 동료들 덕분이었다고 공을 돌린다, effects: { teammateAffinity: 3, coachAffinity: 2 }, trait: teamPlayer }
    once: false

  - id: match_002
    axis: coach
    title: 패배 후 영상 분석
    body: 진 경기 다음 날, 감독이 경기 영상을 틀어 놓고 1학년들을 불렀다.
    trigger: { lastMatchResult: [loss], maxWeek: 18 }
    choices:
      - { text: 내 장면을 밤늦게까지 돌려 본다, effects: { stat: { offTheBall: 1 }, stamina: -10 }, trait: hardWorker }
      - { text: 동료들과 실점 장면을 같이 짚어 본다, effects: { stat: { teamwork: 1 }, teammateAffinity: 2 }, trait: teamPlayer }
      - { text: 이미 지난 경기라며 푹 쉰다, effects: { stamina: 10, coachAffinity: -2 } }
    once: false

  - id: match_003
    axis: teammate
    title: 아쉬운 무승부
    body: 비긴 경기 뒤 버스 안, 동기들이 말없이 창밖만 본다.
    trigger: { lastMatchResult: [draw], maxWeek: 18 }
    choices:
      - { text: 다음엔 꼭 이기자고 말한다, effects: { stat: { momentum: 1 }, teammateAffinity: 2 }, trait: competitor }
      - { text: 한 명씩 어깨를 두드려 준다, effects: { teammateAffinity: 4 }, trait: teamPlayer }
    once: false

  - id: match_004
    axis: family
    title: 가족의 축하 메시지
    body: 공격 포인트를 올린 경기 뒤, 가족 단톡방에 축하 메시지가 쏟아졌다.
    trigger: { lastMatchContributed: true, maxWeek: 18 }
    choices:
      - { text: 덕분이라며 고맙다고 답장한다, effects: { familyAffinity: 3 }, trait: modelStudent }
      - { text: 다음 경기도 보러 오라고 한다, effects: { familyAffinity: 2, stat: { momentum: 0.5 } }, trait: competitor }
    once: false

  - id: match_005
    axis: common
    title: 아무것도 남기지 못한 경기
    body: 골도 도움도 없이 끝난 경기. 숙소에 돌아와도 장면들이 머릿속에 맴돈다.
    trigger: { lastMatchContributed: false, maxWeek: 18 }
    choices:
      - { text: 혼자 운동장에 나가 슈팅을 복기한다, effects: { stat: { finishing: 1 }, stamina: -10 }, trait: hardWorker }
      - { text: 내 역할을 노트에 정리해 본다, effects: { stat: { composure: 0.5 }, academics: 1 }, trait: modelStudent }
    once: false

  - id: match_006
    axis: common
    title: 패배 후 귀갓길
    body: 진 경기 뒤 집에 가는 버스. 휴대폰에는 응원 메시지가 몇 개 와 있다.
    trigger: { lastMatchResult: [loss], maxWeek: 18 }
    choices:
      - { text: 다음 경기에서 갚아 주겠다고 다짐한다, effects: { stat: { mental: 1 } }, trait: competitor }
      - { text: 집에 가서 일찍 잔다, effects: { stamina: 10 }, trait: modelStudent }
    once: false
