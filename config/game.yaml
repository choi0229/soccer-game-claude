# 고교 축구 육성 시뮬레이션 - 기본 규칙 수치 (튜닝 전 초기값)
# 주(week) 표기는 {month, week} 이고, 1년은 3월 1주에서 시작한다.

calendar:
  weeksPerYear: 48
  weeksPerMonth: 4
  startMonth: 3
  vacations:
    - { name: 여름방학, from: { month: 7, week: 4 }, to: { month: 8, week: 4 } }
    - { name: 겨울방학, from: { month: 1, week: 1 }, to: { month: 2, week: 4 } }
  league:
    matchDay: SAT
    blocks:
      - { fromRound: 1, toRound: 7, from: { month: 3, week: 3 }, to: { month: 5, week: 1 } }
      - { fromRound: 8, toRound: 14, from: { month: 5, week: 4 }, to: { month: 7, week: 2 } }
  cup:
    name: 춘계배
    # 라운드 순서대로의 경기일 (32강, 16강, 8강, 4강, 결승)
    matchDays:
      - { month: 3, week: 1, day: WED }
      - { month: 3, week: 1, day: SAT }
      - { month: 3, week: 2, day: TUE }
      - { month: 3, week: 2, day: THU }
      - { month: 3, week: 2, day: SAT }

stats:
  min: 0
  max: 100
  trained:
    - { key: finishing, name: 결정력, group: attack }
    - { key: shotPower, name: 슈팅 파워, group: attack }
    - { key: composure, name: 침착성, group: attack }
    - { key: offTheBall, name: 오프더볼, group: attack }
    - { key: heading, name: 헤더, group: attack }
    - { key: speed, name: 스피드, group: attack }
    - { key: firstTouch, name: 퍼스트 터치, group: link }
    - { key: workRate, name: 활동량, group: link }
    - { key: dribbling, name: 드리블, group: link }
    - { key: passing, name: 패스 정확도, group: link }
    - { key: kickPower, name: 킥력, group: link }
    - { key: teamwork, name: 팀워크, group: link }
  passive:
    - { key: momentum, name: 기세 }
    - { key: vsFighter, name: 파이터형 대응 }
    - { key: vsCommander, name: 커맨더형 대응 }
    - { key: clutch, name: 클러치 }
    - { key: mental, name: 멘탈 }
    - { key: fitness, name: 기초체력 }
  start:
    trained: { min: 15, max: 35 }
    passive: { min: 30, max: 50 }
  grades:
    - { grade: S, min: 90 }
    - { grade: A, min: 80 }
    - { grade: B, min: 70 }
    - { grade: C, min: 60 }
    - { grade: D, min: 50 }
    - { grade: E, min: 40 }
    - { grade: F, min: 30 }
    - { grade: G, min: 0 }

archetype:
  key: power
  name: 파워형
  position: 공격수
  primaryStats: [shotPower, heading, kickPower]
  primaryStartBonus: 10
  primaryGrowthMultiplier: 1.2

training:
  team: { baseGrowth: 0.09, stamina: -8 }
  personal: { baseGrowth: 0.06, stamina: -6 }
  # 능력치가 below 미만이면 factor 적용 (위에서부터 처음 맞는 구간)
  decay:
    - { below: 60, factor: 1.0 }
    - { below: 80, factor: 0.7 }
    - { below: 1000, factor: 0.4 }
  # 특성 보너스 + 인연 보너스 합계의 상한. 성장량 = ... × (1 + min(합계, bonusCap))
  bonusCap: 0.30

daily:
  # 판 시작 시 새벽·오전 수업 기본 선택
  defaultDawn: SLEEP
  defaultClassAttitude: FOCUS
  dawn:
    exercise: { fitness: 0.04, stamina: -6 }
    sleep: { stamina: 8 }
  classAttitudes:
    FOCUS: { name: 수업 집중, academics: 1.5, scaleAcademicsByFriends: true, stamina: -2, friendAffinity: 0, friendEventChance: 0 }
    DOZE: { name: 졸기, academics: -0.5, scaleAcademicsByFriends: false, stamina: 8, friendAffinity: 0, friendEventChance: 0 }
    QUESTION: { name: 선생님께 질문, academics: 1.0, scaleAcademicsByFriends: false, stamina: 0, friendAffinity: 0, friendEventChance: 0 }
    FRIENDS: { name: 친구와 어울리기, academics: 0, scaleAcademicsByFriends: false, stamina: 0, friendAffinity: 3, friendEventChance: 0.15 }
  # 수업 집중 학업 배율 = base + 학교 친구 관계도 / divisor
  friendMultiplier: { base: 1.0, divisor: 200 }
  nightRecovery: 8
  # 방학 주의 밤 회복 (일요일 추가 회복은 이 값에 더한다)
  vacationNightRecovery: 12
  sundayExtraRecovery: 20
  sunday:
    rest: { stamina: 25, condition: 1 }
    partTime: { money: 30000, stamina: -10 }
    # 잠긴 축(여자친구)은 열린 뒤에만 만날 수 있다
    meet: { affinity: 5, targets: [coach, teammate, family, girlfriend] }

stamina:
  # 최대치 = maxBase + (기초체력 - fitnessPivot) / fitnessDivisor
  maxBase: 100
  fitnessPivot: 50
  fitnessDivisor: 2
  injuryRiskBelow: 30
  injuryChancePerSlot: 0.03
  injuryWeeks: [1, 2, 3, 4]
  exhaustionBelow: 10
  exhaustionCoachDelta: -2

condition:
  start: 2
  levels:
    - { name: 매우 나쁨, training: 0.90, match: -10 }
    - { name: 나쁨, training: 0.95, match: -5 }
    - { name: 보통, training: 1.00, match: 0 }
    - { name: 좋음, training: 1.05, match: 5 }
    - { name: 매우 좋음, training: 1.10, match: 10 }
  saturdayDropBelowStamina: 30

academics:
  start: 50
  min: 0
  max: 100
  # 학기 중인 주가 끝날 때마다(일요일 처리 끝) 현재 학업 성취 × 이 비율만큼 더한다. 방학 주에는 적용하지 않는다.
  semesterWeeklyRate: -0.06
  # 한 주가 끝날 때(학기 중 감소 뒤) 학업 성취가 below 미만이면 다음 주 월~금 오후 팀 훈련이 '나머지 공부'로 바뀐다.
  # 학기 중과 방학 모두 적용. 나머지 공부는 성장 없음, 학업 성취 academics, 체력 stamina.
  makeup: { below: 30, academics: 2, stamina: -8 }
  # 화면 헤더에 학업 경고를 띄우는 기준
  warningBelow: 40

relationships:
  min: 0
  max: 100
  start: { coach: 30, teammate: 30, family: 50, friend: 30 }
  # 처음에는 잠긴 축. 이벤트 효과(unlockAxis)로 열리며 그때 관계도가 unlockAffinity 가 된다.
  # 일요일에 그 축을 만나지 않은 주가 끝날 때마다 missedWeekChange 만큼 바뀐다.
  girlfriend: { unlockAffinity: 30, missedWeekChange: -2 }

# 특성: 이벤트 선택지의 trait 를 고르면 점수 +1. 점수가 tiers 이상이면 1/2/3단계.
traits:
  tiers: [6, 14, 24]
  list:
    - key: hardWorker
      name: 노력파
      description: 야간 개인 훈련 성장
      trainingBonus: { slots: [NIGHT], values: [0.05, 0.10, 0.15] }
    - key: competitor
      name: 승부사
      description: 슈팅·파워·제공권 메뉴 성장 (어느 칸이든)
      trainingBonus: { menus: [shooting, power, aerial], values: [0.05, 0.10, 0.15] }
    - key: teamPlayer
      name: 팀플레이어
      description: 연계·압박·돌파 메뉴 성장 (어느 칸이든)
      trainingBonus: { menus: [link, pressing, breakthrough], values: [0.05, 0.10, 0.15] }
    - key: modelStudent
      name: 모범생
      description: 학기 중 주간 학업 감소율
      semesterWeeklyRate: [-0.05, -0.04, -0.03]

# 인연: 축의 현재 관계도가 tiers 이상이면 1/2/3단계 (관계도가 내려가면 단계도 내려간다)
bonds:
  tiers: [40, 60, 80]
  axes:
    - axis: coach
      description: 팀 훈련(오전·오후) 성장
      trainingBonus: { slots: [MORNING, AFTERNOON], values: [0.03, 0.06, 0.09] }
    - axis: teammate
      description: 야간 개인 훈련 성장
      trainingBonus: { slots: [NIGHT], values: [0.03, 0.06, 0.09] }
    - axis: family
      description: 밤 체력 회복
      nightRecovery: [1, 2, 3]
    - axis: friend
      description: 새 효과 없음 (수업 집중의 학업 배율은 학교 친구 관계도로 계산)
    - axis: girlfriend
      description: 모든 훈련 메뉴 성장
      trainingBonus: { values: [0.02, 0.04, 0.06] }

resources:
  money: 0
  reputation: 0

match:
  minutes: 80
  selection:
    # 출전 점수 = 감독 관계도 × coachWeight + 훈련 능력치 상위 topStatCount 개 평균 × statWeight
    coachWeight: 0.3
    statWeight: 0.7
    topStatCount: 6
    # 선발 = 출전 점수 ≥ 팀 전력 × starterRatio, 교체 = ≥ 팀 전력 × subRatio, 그 밖은 벤치
    starterRatio: 0.85
    subRatio: 0.60
  teamGoals: { base: 1.2, perStrength: 0.03, min: 0.2, max: 3.5 }
  sceneCount:
    starter: { min: 4, max: 5 }
    sub: { min: 1, max: 2 }
    bench: { min: 0, max: 0 }
  staminaCost: { starter: -12, sub: -5, bench: 0 }
  judgement:
    goalBase: 25
    otherBase: 50
    statFactor: 0.8
    min: 5
    max: 95
  passive:
    pivot: 50
    divisor: 5
    min: -10
    max: 10
    totalMin: -10
    totalMax: 10
    clutchFromMinute: 60
    clutchMaxGoalDiff: 1
    growthPerMatch: 0.5
  takeOnBonus: 15
  pressingGoalChance: 0.3
  penaltyWinChance: 0.5
  # goalFailure: 골이 되는 장면의 실패, failure: 그 밖의 장면 실패
  rating: { base: 6.0, goal: 1.0, assist: 0.7, otherSuccess: 0.3, goalFailure: -0.1, failure: -0.2, min: 3.0, max: 10.0 }
  coachFeedback: { goodFrom: 7.0, goodDelta: 2, badBelow: 5.5, badDelta: -2 }
  points: { win: 3, draw: 1, loss: 0 }

reputation:
  gradeMultiplier: 0.5
  # 위에서부터 처음 맞는 구간 하나만 적용
  rating:
    - { from: 8.0, value: 6 }
    - { from: 7.0, value: 3 }
  goal: 2
  assist: 1
  # 춘계배에서 해당 단계에 오르면 지급 (남은 팀 수 기준)
  cupStages:
    - { teamsLeft: 8, name: 8강, value: 10 }
    - { teamsLeft: 4, name: 4강, value: 20 }
    - { teamsLeft: 1, name: 우승, value: 40 }

events:
  sundayChance: 0.7
  cooldownWeeks: 4
